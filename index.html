<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STEMBridge Animation Engine</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font-family: system-ui, sans-serif; }
    #stage { display: flex; justify-content: center; align-items: center; height: calc(100% - 56px); }
    #stage canvas { width: min(100vw, calc((100vh - 56px) * 16 / 9)); height: auto; display: block; }
    #controls { height: 56px; display: flex; gap: 12px; align-items: center; padding: 0 16px; color: #fff; background: #14532d; }
    #controls button { font-size: 16px; padding: 6px 14px; border: 0; border-radius: 6px; background: #f5b700; cursor: pointer; }
    #seek { flex: 1; }
    body.render #controls { display: none; }
    body.render #stage { height: 100%; }
    body.render #stage canvas { width: 1920px; height: 1080px; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="controls">
    <button id="play">Pause</button>
    <input id="seek" type="range" min="0" max="1" step="0.01" value="0" />
    <span id="time">0.0 / 0.0 s</span>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
